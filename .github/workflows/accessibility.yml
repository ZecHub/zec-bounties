name: Accessibility

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: zec-bounties-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: zec-bounties-frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: yarn tsc --noEmit

      - name: Run accessibility tests
        run: yarn test:a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-playwright-report
          path: zec-bounties-frontend/playwright-report/
          retention-days: 14
