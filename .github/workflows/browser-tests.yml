name: Browser tests

# These suites check visible text, so harmless UI changes can break them.
# They run after merge, so a failure points at one merged PR and never
# blocks a contributor's PR.
on:
  push:
    branches:
      - main
    paths:
      - "zec-bounties-frontend/**"
      - ".github/workflows/browser-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: zec-bounties-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: zec-bounties-frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: yarn test:browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests-playwright-report
          path: zec-bounties-frontend/playwright-report/
          retention-days: 14
